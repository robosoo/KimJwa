<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습센터 반응형 검증</title><style>body{margin:0;background:#dce3e8;font:14px system-ui;color:#233b50}header{padding:10px 18px;background:white}header a{margin:0 12px 0 0;color:#086d74}#stage{margin:14px auto;position:relative}iframe{border:0;transform-origin:top left;background:white;box-shadow:0 1px 8px #52657533}p{margin:5px 0}</style><header><strong id="size"></strong><p><a href="?width=390&height=844">390 · 모바일</a><a href="?width=844&height=390">844 · 모바일 가로</a><a href="?width=768&height=1024">768 · 태블릿</a><a href="?width=1024&height=768">1024 · iPad 가로</a><a href="?width=1440&height=1000">1440 · 데스크톱</a></p></header><div id="stage"><iframe title="검증 화면" id="viewport"></iframe></div><script>const q=new URLSearchParams(location.search),w=Number(q.get('width'))||390,h=Number(q.get('height'))||844,scale=Math.min(1,(innerWidth-40)/w,(innerHeight-110)/h);const frame=document.getElementById('viewport');frame.width=w;frame.height=h;frame.style.transform='scale('+scale+')';frame.src='/#'+(q.get('route')||'start');const stage=document.getElementById('stage');stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';document.getElementById('size').textContent=w+' × '+h+' CSS px · 실제 iframe viewport · 시각 배율 '+scale.toFixed(2);</script></html>
