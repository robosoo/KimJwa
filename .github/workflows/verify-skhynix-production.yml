name: Verify SK hynix Quiz Production
on:
  workflow_dispatch:
  push:
    paths:
      - '민좌/ai-hackathon-mock-lab/reports/production-deployment.json'
      - '.github/workflows/verify-skhynix-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch production URL and check real served content
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          root='https://skhynix-ai-hackathon-quiz.vercel.app'
          last=None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(root+'/bank-version.json?check=20261012', timeout=20) as f:
                      info=json.load(f)
                  with urllib.request.urlopen(root+'/?check=20261012', timeout=20) as f:
                      page=f.read().decode('utf-8')
                  assert info['questions']==64, info
                  assert info['conceptLessons']==26, info
                  assert info.get('wikiArticles')==26, info
                  assert info['practiceTasks']==8, info
                  assert info['fourPCases']==6, info
                  assert info.get('fourPDrills')==6, info
                  assert info.get('fourPTransferChecks')==6, info
                  assert info.get('fourPIndependentChecks')==12, info
                  assert info.get('fourPDeepTheory')==4, info
                  assert info['fourPStages']==24, info
                  assert info['fourPChecks']==8, info
                  assert 'id="fourp"' in page, '4P study menu not served'
                  assert 'AI 개념 위키 · 26개 항목' in page, 'domain-neutral concept wiki not served'
                  assert '4P 개념 사전 → 이해 확인 → 반도체 적용' in page, '4P theory-first menu not served'
                  assert 'function fourDrill(c)' in page, 'AI wrong-answer probe not served'
                  assert 'function renderFourDiagnostics()' in page, 'independent 12-diagnostic practice not served'
                  assert 'id="fourTheoryDeep"' in page, 'deep 4P neutral theory missing'
                  assert '"id":"FP06-D2"' in page, 'last diagnostic missing'
                  assert 'wiki?.definition' in page, 'AI encyclopedia rendering missing'
                  assert '"id":"FP06"' in page, 'Semiconductor case FP06 not embedded'
                  assert '"id":"QC08"' in page, '4P quick check QC08 not embedded'
                  assert 'Plan' in page and 'Prompt' in page and 'Probe' in page and 'Protect' in page
                  assert '"id":"R1-064"' in page, 'Question 64 not embedded in served HTML'
                  assert '"id":"C26"' in page, 'Concept C26 not embedded in served HTML'
                  print('Production LIVE PASS:', root, info, 'HTML bytes',len(page.encode('utf-8')))
                  break
              except Exception as exc:
                  last=repr(exc)
                  print('Attempt',attempt+1,'failed:',last)
                  time.sleep(5)
          else:
              raise RuntimeError('Production serving 64/26/8 + 4P verification failed: '+str(last))
          PY
