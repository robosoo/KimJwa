name: Coverage audit software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI smoke test
        run: python tools/coverage_audit.py --input examples/synthetic_coverage.csv --output /tmp/context_coverage_report.json
