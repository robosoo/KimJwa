name: Publish AI Hackathon Study Site
on:
  push:
    branches: [main]
    paths:
      - '민좌/ai-hackathon-mock-lab/data/**'
      - '민좌/ai-hackathon-mock-lab/src/**'
      - '민좌/ai-hackathon-mock-lab/scripts/**'
      - '민좌/ai-hackathon-mock-lab/release/**'
      - '.github/workflows/hackathon-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hackathon-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and validate 64 questions, 26 concepts and practice tasks
        working-directory: 민좌/ai-hackathon-mock-lab
        run: |
          node scripts/build.mjs
          python3 scripts/check-numbers.py
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('dist')
          info=json.loads((root/'bank-version.json').read_text())
          assert info['questions']==64, info
          assert info['conceptLessons']==26, info
          assert info['practiceTasks']==8, info
          assert 'C26' in (root/'index.html').read_text()
          print('64 questions, 26 concepts, 8 practice tasks verified')
          PY
      - name: Check whether Pages is enabled
        id: pages-ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$http_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages not enabled (HTTP $http_code). Set Repository Settings > Pages > Source to GitHub Actions. Skipping publish, build and QA remain valid."
          fi
      - name: Configure Pages
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload web app
        if: steps.pages-ready.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 민좌/ai-hackathon-mock-lab/dist
      - name: Deploy to GitHub Pages
        if: steps.pages-ready.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
